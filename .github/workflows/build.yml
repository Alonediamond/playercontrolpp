name: _step.build

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        required: false
        default: false
      target_subproject:
        description: see release.yml, leave it empty to build all
        type: string
        required: false
        default: ''
#      # [FEATURE] MIXIN_AUDITOR
#      mixin_audit:
#        description: run mixin audit for Minecraft after build
#        type: boolean
#        required: false
#        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 允许 rolling release 步骤往 GitHub Release 里传附件。
    # 注意：本工作流被 gradle.yml / release.yml 以 reusable workflow 方式调用，
    # 被调用方申请的权限 ⊆ 调用方授予的权限——两个调用方的对应 job 都显式授了 contents: write。
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}

      # maven.parchmentmc.org 偶发长时间不可达（曾把 CI 整个挂掉）。
      # Parchment 数据优先取仓库内 libs/maven/（common.gradle 里优先命中），
      # 缺失的版本从这里带重试补拉（官方源 + ldtteam JFrog 镜像各试一轮）；
      # 下载成功一次后会被 setup-gradle 的缓存收编。
      - name: Fetch missing parchment data
        run: |
          fetch() {
            local mc=$1 ver=$2
            local d="libs/maven/org/parchmentmc/data/parchment-$mc/$ver"
            local f="$d/parchment-$mc-$ver.zip"
            [ -s "$f" ] && return 0
            echo "parchment-$mc/$ver missing from repo, fetching..."
            local urls=(
              "https://ldtteam.jfrog.io/artifactory/parchmentmc-public/org/parchmentmc/data/parchment-$mc/$ver/parchment-$mc-$ver.zip"
              "https://maven.parchmentmc.org/org/parchmentmc/data/parchment-$mc/$ver/parchment-$mc-$ver.zip"
            )
            for round in 1 2; do
              for u in "${urls[@]}"; do
                curl -sfL --max-time 90 -o "$f" "$u" && [ -s "$f" ] && { echo "got $mc/$ver from $u"; return 0; }
                rm -f "$f"; sleep 8
              done
            done
            echo "::error::Could not fetch parchment-$mc $ver from any mirror (jfrog / parchmentmc.org)"
            return 1
          }
          fetch 1.21.1 2024.11.17
          fetch 1.21.4 2025.03.23
          fetch 1.21.10 2025.10.12
          fetch 1.21.11 2025.12.20

      - name: Build with gradle
        run: |
          chmod +x gradlew
          if [ -z "${{ inputs.target_subproject }}" ]; then
              echo "Building all subprojects"
              ./gradlew build
          else
              args=$(echo "${{ inputs.target_subproject }}" | tr ',' '\n' | sed 's/$/:build/' | paste -sd ' ')
              echo "Building with arguments=$args"
              ./gradlew $args
          fi
        env:
          BUILD_ID: ${{ github.run_number }}
          BUILD_RELEASE: ${{ inputs.release }}

#      # [FEATURE] MIXIN_AUDITOR
#      - name: Run mixin audit check for Minecraft client
#        if: ${{ inputs.mixin_audit }}
#        timeout-minutes: 10
#        run: |
#          mkdir -p ./run
#          echo eula=true > ./run/eula.txt  # server needs this
#          ./gradlew runClientMixinAudit

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: versions/*/build/libs/

      - name: Collect mod jars
        run: |
          shopt -s extglob
          mkdir mod-jars
          for jar in versions/*/build/libs/!(*-@(dev|sources|shadow)).jar; do
              cp -p "$jar" mod-jars/
          done
          ls -l mod-jars

      # This is the artifact recommended for users to download
      - name: Upload mod jars
        uses: actions/upload-artifact@v6
        with:
          name: mod-jars
          path: mod-jars/*.jar

      # push 触发的开发构建直接挂到一个滚动的 pre-release（tag: dev-build），
      # 附件同名覆盖，链接永远指向最新构建。PR / 正式发布（release.yml）不走这里。
      - name: Attach mod jars to rolling dev release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Dev Build (rolling)
          body: |-
            最新开发构建，由 push 自动生成（`v<版本>-mc<MC版本>+build.<N>`）。

            - 按 Minecraft 版本下载对应 jar；正式版发布请看下方的非预发布 Release。
            - 构建来源: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          make_latest: false
          files: mod-jars/*.jar
          overwrite_files: true

#      # [FEATURE] FALLENS_MAVEN
#      - name: Publish with gradle
#        if: ${{ inputs.release || github.ref == 'refs/heads/dev' }}
#        run: |
#          if [ -z "$FALLENS_MAVEN_TOKEN" ]; then
#              echo "No token found, skipping publish"
#              exit 0
#          fi
#          if [ -z "${{ inputs.target_subproject }}" ]; then
#              echo "Publishing all subprojects"
#              ./gradlew publish
#          else
#              args=$(echo "${{ inputs.target_subproject }}" | tr ',' '\n' | sed 's/$/:publish/' | paste -sd ' ')
#              echo "Publishing with arguments=$args"
#              ./gradlew $args
#          fi
#        env:
#          BUILD_ID: ${{ github.run_number }}
#          BUILD_RELEASE: ${{ inputs.release }}
#          FALLENS_MAVEN_TOKEN: ${{ secrets.FALLENS_MAVEN_TOKEN }}

  summary:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: List artifacts
        uses: actions/github-script@v8
        id: artifacts
        with:
          script: |
            const result = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            })
            return result.data

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: build-artifacts

      - name: Make build summary
        run: |
          pip install jproperties
          python .github/workflows/scripts/summary.py
        env:
          TARGET_SUBPROJECT: ${{ inputs.target_subproject }}
          WORKFLOW_ARTIFACTS: ${{ steps.artifacts.outputs.result }}
